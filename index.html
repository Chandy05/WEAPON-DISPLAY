<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LIVE SCORE DISPLAY</title>
    <style>
        /* รีเซ็ตค่าขอบเขตทั้งหมดให้พอดีเป๊ะ 100% */
        *, *:before, *:after { box-sizing: border-box; }
        html, body { 
            background-color: #e9ecef; margin: 0; padding: 0; 
            font-family: 'Tahoma', sans-serif; 
            height: 100%; width: 100%; 
            overflow: hidden; /* ล็อกหน้าจอห้ามมีแถบเลื่อน */
        }

        /* ตารางหลักขึงตึง 100% */
        table { 
            width: 100%; height: 100%; 
            border-collapse: collapse; background: white; 
            table-layout: fixed; border: 3px solid #343a40; 
        }

        /* หัวตาราง (คงที่ 8% ของความสูงจอ) */
        thead { height: 8vh; }
        th { 
            background-color: #343a40; color: white; 
            font-size: 2.8vh; font-weight: bold; 
            border: 1px solid #555; text-transform: uppercase; 
        }

        /* ส่วนเนื้อหาแบ่งตามจำนวนนักบิน (92% ที่เหลือ) */
        tbody { height: 92vh; }
        tr.pilot-block { height: var(--row-height, 23vh); }
        
        td { border: 1px solid #bbb; text-align: center; vertical-align: top; padding: 0; }
        tr td { border-bottom: 3px solid #343a40 !important; }

        /* คอลัมน์ลำดับเครื่อง (ปรับยืดหยุ่นตามโหมด) */
        .th-pilot { width: var(--pilot-col-width, 6%); }
        .pilot-col { width: var(--pilot-col-width, 6%); vertical-align: middle; background: #f8f9fa; border-right: 3px solid #343a40 !important; }
        .pilot-num { font-size: var(--pilot-font-size, 4vh); font-weight: bold; color: #000; line-height: 1.2; padding: 5px; }

        /* การแบ่งพื้นที่ 4 แถวในแต่ละช่อง */
        .score-cell { display: flex; flex-direction: column; height: 100%; width: 100%; }
        .bomb-row { 
            flex: 1; min-height: 0; 
            display: flex; align-items: center; justify-content: center; 
            font-size: 4vh; font-weight: bold; color: #000; 
            border-bottom: 1px solid #ddd; width: 100%; 
        }
        .bomb-row:last-child { border-bottom: none; }

        .plus-sign { color: #ff1744; margin-left: 2px; }
        .th-strf-total { width: 10%; background-color: #2c3e50; }
        .total-col { background: #fff3cd; color: #856404; font-weight: bold; font-size: 6vh; vertical-align: middle; }

        .otp-badge {
            position: fixed;
            top: 15px;
            right: 15px;
            background: #212529;
            color: #ffeb3b;
            font-size: 2.8vh;
            font-weight: bold;
            border-radius: 8px;
            padding: 10px 20px;
            z-index: 9999;
            box-shadow: 0 4px 10px rgba(0,0,0,0.4);
            letter-spacing: 4px;
            font-family: 'Courier New', monospace;
            display: none;
        }
        body.theme-local .otp-badge { display: block; }

        .otp-gate {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: #1a1d20; display: flex; flex-direction: column;
            align-items: center; justify-content: center; z-index: 99999;
            font-family: 'Tahoma', sans-serif;
        }
        .otp-gate input {
            font-size: 3vh; letter-spacing: 8px; text-align: center;
            padding: 12px 20px; border-radius: 8px; border: none;
            width: 260px; margin-bottom: 15px; font-family: 'Courier New', monospace;
        }
        .otp-gate button {
            font-size: 2.2vh; padding: 10px 30px; border-radius: 8px;
            background: #ffc107; border: none; cursor: pointer; font-weight: bold;
        }
        .otp-gate button:hover { background: #ffca2c; }
        .otp-gate .otp-title { color: #ffeb3b; font-size: 2.8vh; margin-bottom: 20px; font-weight: bold; }
        .otp-gate .otp-error { color: #ff5252; font-size: 2vh; margin-top: 10px; min-height: 25px; }

        .latest-hl { background-color: #d4edda !important; padding: 0 5px; border-radius: 4px; display: inline-block; }
        .target-cursor { background-color: #fffde7 !important; box-shadow: inset 0 0 0 3px #d32f2f !important; }
        .group-1 { color: #FF8F00 !important; } .group-2 { color: #0D47A1 !important; }
        .group-3 { color: #C2185B !important; }
        .group-4 { color: #4A148C !important; }

        /* ธีม Local (ออฟฟิศ) โคลนหน้าตาจากตารางหลัก + ยืดความสูง 100% แบบ Firebase */
        body.theme-local { background-color: #e9ecef; padding: 10px; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; overflow: hidden; }
        body.theme-local #displayTable { width: 100%; height: 100%; margin: 0 auto; background: white; padding: 0; box-shadow: 0 4px 10px rgba(0,0,0,0.15); border-collapse: collapse; table-layout: fixed; border: 3px solid #343a40; }
        body.theme-local #tableHead th { background-color: #343a40; color: white; padding: 8px; font-size: 2.2vh; text-transform: uppercase; border: 1px solid #555; }
        body.theme-local #tableHead #tableMissionHeader { background: #2c3e50; color: #ffeb3b; font-size: 2.5vh; text-align: left; padding: 8px 15px; font-weight: bold; letter-spacing: 1px; border: 1px solid #555; border-bottom: 3px solid #343a40; }
        body.theme-local tbody { height: 92vh; }
        body.theme-local tr.pilot-block { height: var(--row-height); }
        body.theme-local td { border: 1px solid #bbb; text-align: center; vertical-align: top; padding: 0; }
        body.theme-local .th-pilot { width: var(--pilot-col-width, 16%) !important; border-right: 3px solid #555 !important; }
        body.theme-local .pilot-col { width: var(--pilot-col-width, 16%) !important; border-right: 3px solid #343a40 !important; background: #f8f9fa; vertical-align: middle; }
        body.theme-local .pilot-num { font-size: var(--pilot-font-size, 2.8vh) !important; font-weight: bold; color: #000; padding: 0; line-height: 1.2; }
        body.theme-local .score-cell { display: flex; flex-direction: column; height: 100%; width: 100%; padding: 0 !important; background: #fff; }
        body.theme-local .bomb-row { flex: 1; min-height: 0; display: flex; align-items: center; justify-content: center; font-size: 3.5vh !important; font-weight: bold; border-bottom: 1px dotted #ccc; width: 100%; color: #000; }
        body.theme-local .bomb-row:last-child { border-bottom: none !important; }
        body.theme-local tr td { border-bottom: 3px solid #343a40 !important; }
        body.theme-local .th-strf-total { width: 12%; background-color: #343a40; font-size: 2.2vh; }
        body.theme-local .total-col { background: #fff3cd; font-weight: bold; color: #856404; font-size: 5vh !important; }
    </style>
</head>
<body>

    <div id="otpBadge" class="otp-badge">OTP: ------</div>

    <div id="otpGate" class="otp-gate" style="display:none;">
        <div class="otp-title">🔒 กรุณากรอกรหัส OTP เพื่อเข้าดูผลการยิง</div>
        <input type="text" id="otpInput" maxlength="6" placeholder="- - - - - -" inputmode="numeric">
        <button onclick="submitOtp()">ยืนยัน</button>
        <div class="otp-error" id="otpError"></div>
    </div>

    <table id="displayTable">
        <thead id="tableHead"></thead>
        <tbody id="tableBody"></tbody>
    </table>
    
        <script>
      const urlParams = new URLSearchParams(window.location.search);
      const isLocalMode = urlParams.get('local') === 'true' || window.location.href.includes('local=true');

      // ลิงก์ Worker ของคุณ (แทนที่ Firebase SDK เดิม)
      const WORKER_URL = "https://chdy-otp-worker.chandy-score.workers.dev/?otp=123456";

      let lastMissionHeader = null;

      function generateAndPushOtp() {
          const newOtp = Math.floor(100000 + Math.random() * 900000).toString();
          document.getElementById('otpBadge').innerText = "OTP: " + newOtp;
          fetch("https://chdy-score-default-rtdb.asia-southeast1.firebasedatabase.app/otpControl.json", {
              method: "PUT",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({ code: newOtp, updatedAt: Date.now() })
          }).catch(err => console.error("ไม่สามารถอัปเดต OTP ได้:", err));
      }

      function checkMissionChangeAndUpdateOtp(data) {
          const currentHeader = (data && data.missionHeader) ? data.missionHeader : null;
          if (currentHeader !== lastMissionHeader) {
              lastMissionHeader = currentHeader;
              generateAndPushOtp();
          }
      }

      let verifiedOtp = null;
      let fetchIntervalId = null;

      if (isLocalMode) {
          document.body.classList.add('theme-local');
          document.title = "OFFICE DISPLAY (LOCAL)";

          window.addEventListener('storage', (event) => {
            if (event.key === 'liveDisplayData' && event.newValue) renderBoard(JSON.parse(event.newValue));
          });
          window.addEventListener('DOMContentLoaded', () => {
            let initData = localStorage.getItem('liveDisplayData');
            if (initData) renderBoard(JSON.parse(initData));
            else renderBoard(null);
          });
      } else {
          document.getElementById('displayTable').style.display = 'none';
          document.getElementById('otpGate').style.display = 'flex';

          let savedOtp = sessionStorage.getItem('verifiedOtp');
          if (savedOtp) {
              verifiedOtp = savedOtp;
              document.getElementById('otpGate').style.display = 'none';
              startFetchingData();
          }

          document.getElementById('otpInput').addEventListener('keypress', function(e) {
              if (e.key === 'Enter') submitOtp();
          });
      }

      async function submitOtp() {
          const inputVal = document.getElementById('otpInput').value.trim();
          const errorBox = document.getElementById('otpError');
          if (inputVal.length !== 6) {
              errorBox.innerText = "กรุณากรอกรหัส 6 หลัก";
              return;
          }
          try {
              const testUrl = `https://chdy-otp-worker.chandy-score.workers.dev/?otp=${inputVal}`;
              const response = await fetch(testUrl);
              const data = await response.json();
              if (data && data.error) {
                  errorBox.innerText = "รหัส OTP ไม่ถูกต้อง กรุณาลองใหม่";
              } else {
                  verifiedOtp = inputVal;
                  sessionStorage.setItem('verifiedOtp', inputVal);
                  document.getElementById('otpGate').style.display = 'none';
                  renderBoard(data);
                  startFetchingData();
              }
          } catch (err) {
              errorBox.innerText = "เกิดข้อผิดพลาด กรุณาลองใหม่";
          }
      }

      function startFetchingData() {
          async function fetchDataFromWorker() {
              try {
                  const url = `https://chdy-otp-worker.chandy-score.workers.dev/?otp=${verifiedOtp}`;
                  const response = await fetch(url);
                  if (!response.ok) throw new Error("Fetch failed: " + response.status);
                  const data = await response.json();
                  if (data && data.error) {
                      sessionStorage.removeItem('verifiedOtp');
                      document.getElementById('displayTable').style.display = 'none';
                      document.getElementById('otpGate').style.display = 'flex';
                      document.getElementById('otpError').innerText = "รหัส OTP หมดอายุ กรุณากรอกใหม่";
                      clearInterval(fetchIntervalId);
                      return;
                  }
                  renderBoard(data);
              } catch (err) {
                  console.error("Error fetching data from Worker:", err);
              }
          }
          fetchDataFromWorker();
          fetchIntervalId = setInterval(fetchDataFromWorker, 3000);
      }


      function renderBoard(data) {
        if (isLocalMode) {
            checkMissionChangeAndUpdateOtp(data);
        }
        let displayTable = document.getElementById('displayTable');
        if (!data || !data.columns || data.columns.length === 0 || data.isCleared) {
            if (isLocalMode) {
                displayTable.style.display = 'table';
                document.body.style.backgroundColor = '#e9ecef';
                document.getElementById('tableHead').innerHTML = `<tr><th style="padding:15px; font-size:24px; color:#ffeb3b; background:#343a40;">⏳ STANDBY / รอเริ่มภารกิจถัดไป...</th></tr>`;
                document.getElementById('tableBody').innerHTML = `<tr><td style="height: 50vh; vertical-align:middle; text-align:center; font-size:20px; color:#555;">กระดานถูกล้าง กรุณากด TIME IN จากหน้าจอหลักเพื่อเริ่มการแสดงผล</td></tr>`;
            } else {
                displayTable.style.display = 'none';
                document.body.style.backgroundColor = '#ffffff';
            }
            return;
        } else {
            displayTable.style.display = 'table';
            document.body.style.backgroundColor = '#e9ecef';
        }

        let columns = data.columns;
        let pilots = (data && Array.isArray(data.pilots) && data.pilots.length) ? data.pilots : [];
        let thead = document.getElementById('tableHead');
        let tbody = document.getElementById('tableBody');
        
        let rowCount = Math.max(pilots.length, 4);
        // สั่งให้คำนวณความสูงแถว (ยืด 100%) ทั้งโหมด Local และ Firebase
        let rowH = (92 / rowCount) + "vh";
        document.documentElement.style.setProperty('--row-height', rowH);

        let hasSTRF = columns.some(col => col.isSTRF);
        let nextLetter = String.fromCharCode(65 + columns.length);

        if (isLocalMode) {
            let mH = (data && data.missionHeader) ? data.missionHeader : "-";
            thead.innerHTML = `<tr><th colspan="${columns.length + (hasSTRF?2:1)}" id="tableMissionHeader">
                <div style="display: flex; align-items: center; justify-content: flex-start; gap: 12px;">
                    <img src="https://raw.githubusercontent.com/Chandy05/Chandy-MetarUpdate/main/logo_main.png" style="height: 28px;">
                    <span>${mH}</span>
                </div>
            </th></tr>` + 
            `<tr><th class="th-pilot">Pilot / Tail</th>` + 
            columns.map(c => `<th style="padding: 8px;">${c.name}</th>`).join('') + 
            (hasSTRF ? `<th class="th-strf-total">รวม STRF</th>` : "") + `</tr>`;
        } else {
            thead.innerHTML = `<tr><th class="th-pilot">#</th>` + 
                columns.map(c => `<th>${c.name}</th>`).join('') + 
                (hasSTRF ? `<th class="th-strf-total">${nextLetter}</th>` : "") + `</tr>`;
        }

        const fallbackPilots = Array.from({ length: 4 }, (_, idx) => ({ pId: idx + 1, num: `#${idx + 1}`, strfTotal: 0, cols: {} }));
        const pilotsToRender = pilots.length > 0 ? pilots : fallbackPilots;

        const rowsHtml = pilotsToRender.map(p => {
            let strfTotal = p.strfTotal || 0; 
            let colsHTML = columns.map(col => {
                let passes = (p.cols || {})[col.id] || [];
                let rows = "";
                for(let i=0; i<4; i++) {
                    let cell = passes[i] || { val: "", isLatest: false, isTarget: false, isMulti: false, groupClass: "" };
                    let cleanVal = cell.val ? String(cell.val).trim() : "";
                    let upVal = cleanVal.toUpperCase();

                    let cls = "bomb-row";
                    if (cell.isTarget) cls += " target-cursor";

                    let spanHtml = "";
                    let hlClass = cell.isLatest ? "latest-hl " : "";
                    
                    if (isLocalMode) {
                        if (cell.html && cell.html.trim() !== "") {
                            if (cell.isMulti && cell.groupClass) cls += " " + cell.groupClass;
                            spanHtml = `<div class="${hlClass}" style="width:100%; height:100%; display:flex; align-items:center; justify-content:center;">${cell.html}</div>`;
                        }
                    } else {
                        if (cleanVal !== "") {
                            let inlineColor = "";
                            if (cell.isMulti) {
                                if (cell.groupClass) cls += " " + cell.groupClass;
                            } else {
                                if (upVal === "N/S" || upVal === "D" || upVal.includes("OUT/")) inlineColor = "color: #d32f2f;";
                                else if (upVal === "HIT") inlineColor = "color: #28a745;";
                                else inlineColor = "color: #000000;";
                            }

                            let escaped = cleanVal.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
                            escaped = escaped.replace(/\+/g, '<span class="plus-sign">+</span>');
                            
                            // Re-inject colors for special stamp characters (F and *) with tighter spacing
                            escaped = escaped.replace(/\s*F$/g, '<span style="color:#dc3545;font-weight:bold;margin-left:2px;">F</span>');
                            escaped = escaped.replace(/\s*\*$/g, '<span style="color:#ff9800;font-weight:bold;margin-left:2px;">*</span>');

                            spanHtml = inlineColor ? `<span class="${hlClass}" style="${inlineColor}">${escaped}</span>` : `<span class="${hlClass}">${escaped}</span>`;
                        }
                    }
                    rows += `<div class="${cls}">${spanHtml}</div>`;
                }
                return `<td><div class="score-cell">${rows}</div></td>`;
            }).join('');

            let pilotInfoHTML = "";
            if (isLocalMode) {
                let tailDisp = p.tail ? `<span style="color:#d32f2f;font-weight:bold;background:#fff;border:1px solid #ffc107;border-radius:4px;padding:2px 4px;font-size:1.8vh;display:inline-block;margin-top:2px;">Tail: ${p.tail}</span>` : "";
                let pilotNameDisp = p.pilotName ? `<span style="font-weight:bold;font-size:2.5vh;text-transform:uppercase;color:#000;">${p.pilotName}</span>` : "";
                pilotInfoHTML = `<div style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; height: 100%;">
                    <div class="pilot-num">${p.num}</div>
                    ${pilotNameDisp}
                    ${tailDisp}
                </div>`;
            } else {
                pilotInfoHTML = `<div class="pilot-num">${p.num}</div>`;
            }

            return `<tr class="pilot-block">
                <td class="pilot-col">${pilotInfoHTML}</td>
                ${colsHTML}
                ${hasSTRF ? `<td class="total-col">${strfTotal}</td>` : ""}
            </tr>`;
        }).join('');

        tbody.innerHTML = rowsHtml;
      }
        </script>
</body>
</html>
