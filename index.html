<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LIVE SCORE DISPLAY</title>
    <style>
        /* รีเซ็ตค่าขอบเขตทั้งหมดให้พอดีเป๊ะ 100% */
        *, *:before, *:after { box-sizing: border-box; }
        html, body { 
            background-color: #e9ecef; margin: 0; padding: 0; 
            font-family: 'Tahoma', sans-serif; 
            height: 100%; width: 100%; 
            overflow: hidden; /* ล็อกหน้าจอห้ามมีแถบเลื่อน */
        }

        /* ตารางหลักขึงตึง 100% */
        table { 
            width: 100%; height: 100%; 
            border-collapse: collapse; background: white; 
            table-layout: fixed; border: 3px solid #343a40; 
        }

        /* หัวตาราง (คงที่ 8% ของความสูงจอ) */
        thead { height: 8vh; }
        th { 
            background-color: #343a40; color: white; 
            font-size: 2.8vh; font-weight: bold; 
            border: 1px solid #555; text-transform: uppercase; 
        }

        /* ส่วนเนื้อหาแบ่งตามจำนวนนักบิน (92% ที่เหลือ) */
        tbody { height: 92vh; }
        tr.pilot-block { height: var(--row-height, 23vh); }
        
        td { border: 1px solid #bbb; text-align: center; vertical-align: top; padding: 0; }
        tr td { border-bottom: 3px solid #343a40 !important; }

        /* คอลัมน์ลำดับเครื่อง (ปรับยืดหยุ่นตามโหมด) */
        .th-pilot { width: var(--pilot-col-width, 6%); }
        .pilot-col { width: var(--pilot-col-width, 6%); vertical-align: middle; background: #f8f9fa; border-right: 3px solid #343a40 !important; }
        .pilot-num { font-size: var(--pilot-font-size, 4vh); font-weight: bold; color: #000; line-height: 1.2; padding: 5px; }

        /* การแบ่งพื้นที่ 4 แถวในแต่ละช่อง */
        .score-cell { display: flex; flex-direction: column; height: 100%; width: 100%; }
        .bomb-row { 
            flex: 1; min-height: 0; 
            display: flex; align-items: center; justify-content: center; 
            font-size: 4vh; font-weight: bold; color: #000; 
            border-bottom: 1px solid #ddd; width: 100%; 
        }
        .bomb-row:last-child { border-bottom: none; }

        .plus-sign { color: #ff1744; margin-left: 2px; }
        .th-strf-total { width: 10%; background-color: #2c3e50; }
        .total-col { background: #fff3cd; color: #856404; font-weight: bold; font-size: 6vh; vertical-align: middle; }

        .latest-hl { background-color: #d4edda !important; padding: 0 5px; border-radius: 4px; display: inline-block; }
        .target-cursor { background-color: #fffde7 !important; box-shadow: inset 0 0 0 3px #d32f2f !important; }
        .group-1 { color: #FF8F00 !important; } .group-2 { color: #0D47A1 !important; }
        .group-3 { color: #C2185B !important; } .group-4 { color: #4A148C !important; }
        
        /* ธีมสำหรับหน้าจอ Local (ออฟฟิศ) ให้สวยงามเหมือนจอหลัก */
        body.theme-local { padding: 10px; }
        body.theme-local table { border: none; box-shadow: 0 4px 15px rgba(0,0,0,0.2); border-radius: 8px; overflow: hidden; margin: 0 auto; width: 100%; height: 100%; }
        body.theme-local th { padding: 10px; font-size: 3vh; background: #2c3e50; border: 1px solid #455a64; color: #ffeb3b; letter-spacing: 1px; }
        body.theme-local .th-pilot { background: #1a252f; color: #fff; }
        body.theme-local .pilot-col { background: #eef2f5; border-right: 3px solid #bdc3c7 !important; }
        body.theme-local .pilot-num { font-size: 2.8vh; color: #2c3e50; text-transform: uppercase; }
        body.theme-local .bomb-row { font-size: 3.5vh; }
        body.theme-local td { border: 1px solid #cfd8dc; }
        body.theme-local tr td { border-bottom: 2px solid #90a4ae !important; }
    </style>
    <script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-database-compat.js"></script>
</head>
<body>

    <table id="displayTable">
        <thead id="tableHead"></thead>
        <tbody id="tableBody"></tbody>
    </table>
    
        <script>
            const urlParams = new URLSearchParams(window.location.search);
            const isLocalMode = urlParams.get('local') === 'true';

            if (isLocalMode) {
                    document.body.classList.add('theme-local');
                    document.documentElement.style.setProperty('--pilot-col-width', '16%');
                    document.documentElement.style.setProperty('--pilot-font-size', '2.8vh');
                    document.title = "OFFICE DISPLAY (LOCAL)";

                    window.addEventListener('storage', (event) => {
                        if (event.key === 'liveDisplayData' && event.newValue) renderBoard(JSON.parse(event.newValue));
                    });
                    window.addEventListener('DOMContentLoaded', () => {
                        let initData = localStorage.getItem('liveDisplayData');
                        if (initData) renderBoard(JSON.parse(initData));
                    });
            } else {
                    document.documentElement.style.setProperty('--pilot-col-width', '6%');
                    document.documentElement.style.setProperty('--pilot-font-size', '4vh');

                    if (!firebase.apps.length) {
                        firebase.initializeApp({ apiKey: "AIzaSyCpYbd6xbz8eDVv-PCrqMnXnNwzEkaa75g", authDomain: "chdy-score.firebaseapp.com", databaseURL: "https://chdy-score-default-rtdb.asia-southeast1.firebasedatabase.app", projectId: "chdy-score", storageBucket: "chdy-score.firebasestorage.app", messagingSenderId: "183108640986", appId: "1:183108640986:web:dc03c29b51875ee7cd05e3" });
                    }
                    firebase.database().ref('liveDisplay').on('value', (snapshot) => {
                        if (snapshot.val()) renderBoard(snapshot.val());
                    });
            }

            function renderBoard(data) {
                let columns = (data && Array.isArray(data.columns) && data.columns.length) ? data.columns : [
                        { name: 'A', isSTRF: false }, { name: 'B', isSTRF: false },
                        { name: 'C', isSTRF: false }, { name: 'D', isSTRF: false }
                ];
                let pilots = (data && Array.isArray(data.pilots)) ? data.pilots : [];
                let thead = document.getElementById('tableHead');
                let tbody = document.getElementById('tableBody');
        
                let rowCount = Math.max(pilots.length, 4);
                if (!isLocalMode) document.documentElement.style.setProperty('--row-height', (92 / rowCount) + "vh");

                let hasSTRF = columns.some(col => col.isSTRF);

                if (isLocalMode) {
                    let mH = data.missionHeader || "-";
                    thead.innerHTML = `<tr><th colspan="${columns.length + (hasSTRF?2:1)}" id="tableMissionHeader">
                        <div style="display: flex; align-items: center; justify-content: flex-start; gap: 12px;">
                            <img src="https://raw.githubusercontent.com/Chandy05/Chandy-MetarUpdate/main/logo_main.png" style="height: 28px;">
                            <span>${mH}</span>
                        </div>
                    </th></tr>` + 
                    `<tr><th class="th-pilot">Pilot / Tail</th>` + 
                    columns.map(c => `<th>${c.name}</th>`).join('') + 
                    (hasSTRF ? `<th class="th-strf-total">รวม STRF</th>` : "") + `</tr>`;
                } else {
                    thead.innerHTML = `<tr><th class="th-pilot">#</th>` + 
                        columns.map(c => `<th>${c.name}</th>`).join('') + 
                        (hasSTRF ? `<th class="th-strf-total">TOTAL</th>` : "") + `</tr>`;
                }

                const rowsHtml = (pilots.length ? pilots : Array.from({ length: 4 }, (_, idx) => ({ pId: idx + 1, num: `#${idx + 1}`, strfTotal: 0, cols: {} }))).map(p => {
                        let strfTotal = p.strfTotal || 0; 
                        let colsHTML = columns.map(col => {
                                let passes = (p.cols || {})[col.id] || [];
                                let rows = "";
                                for(let i=0; i<4; i++) {
                                        let cell = passes[i] || { val: "", isLatest: false, isTarget: false, isMulti: false, groupClass: "" };
                                        let cleanVal = cell.val ? String(cell.val).trim() : "";
                                        let upVal = cleanVal.toUpperCase();

                                        let cls = "bomb-row";
                                        if (cell.isTarget) cls += " target-cursor";

                                        let spanHtml = "";
                                        if (cleanVal !== "") {
                                                let inlineColor = "";
                                                if (cell.isMulti) {
                                                        if (cell.groupClass) cls += " " + cell.groupClass;
                                                } else {
                                                        if (upVal === "N/S" || upVal === "D" || upVal.includes("OUT/")) inlineColor = "color: #d32f2f;";
                                                        else if (upVal === "HIT") inlineColor = "color: #28a745;";
                                                        else inlineColor = "color: #000000;";
                                                }

                                                let escaped = cleanVal.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
                                                escaped = escaped.replace(/\+/g, '<span class="plus-sign">+</span>');
                        
                                                let hlClass = cell.isLatest ? "latest-hl " : "";
                                                spanHtml = inlineColor ? `<span class="${hlClass}" style="${inlineColor}">${escaped}</span>` : `<span class="${hlClass}">${escaped}</span>`;
                                        }
                                        rows += `<div class="${cls}">${spanHtml}</div>`;
                                }
                                return `<td><div class="score-cell">${rows}</div></td>`;
                        }).join('');

                        let pilotInfoHTML = "";
                        if (isLocalMode) {
                            let tailDisp = p.tail ? `<span style="color:#d32f2f;font-weight:bold;background:#fff;border:1px solid #ffc107;border-radius:4px;padding:1px 2px;font-size:11px;display:inline-block;margin-top:2px;">Tail: ${p.tail}</span>` : "";
                            pilotInfoHTML = `<div style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; height: 100%;">
                                <div style="font-weight:bold;font-size:14px;text-transform:uppercase;">${p.num} ${p.pilotName || ""}</div>
                                ${tailDisp}
                            </div>`;
                        } else {
                            pilotInfoHTML = `<div class="pilot-num">${p.num}</div>`;
                        }

                        return `<tr class="pilot-block">
                                <td class="pilot-col">${pilotInfoHTML}</td>
                                ${colsHTML}
                                ${hasSTRF ? `<td class="total-col">${strfTotal}</td>` : ""}
                        </tr>`;
                }).join('');

                tbody.innerHTML = rowsHtml;
            }
        </script>
</body>
</html>
